[main]
include=~/.config/foot/themes/*
dpi-aware=yes

[colors]
background=121214
foreground=e0e0e0
cursor=cccccc
selection-background=2a2a2e
selection-foreground=ffffff

regular0=1a1a1c
regular1=e57373
regular2=81c784
regular3=e5c07b
regular4=64b5f6
regular5=ba68c8
regular6=4dd0e1
regular7=e0e0e0

bright0=444448
bright1=ef9a9a
bright2=a5d6a7
bright3=f0d197
bright4=90caf9
bright5=ce93d8
bright6=80deea
bright7=ffffff

[csd]
preferred=none

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
