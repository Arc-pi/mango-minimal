# --- Fonts ---
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# --- Window Layout & Minimalism ---
window_padding_width 12
confirm_os_window_close 0
hide_window_decorations yes

# --- Transparency & Opacity ---
background_opacity 0.85
background_blur    1

# --- Minimalist Cursor & Bell ---
cursor_shape          block
cursor_blink_interval 0
enable_audio_bell     no

# --- Color Scheme (Grayish Black) ---
background #121214
foreground #e0e0e0

cursor        #cccccc
cursor_text_color #121214

selection_background #2a2a2e
selection_foreground #ffffff

# --- 16-Color Palette (Muted Grayish Tones) ---
# Black
color0 #1a1a1c
color8 #444448

# Red
color1 #e57373
color9 #ef9a9a

# Green
color2 #81c784
color10 #a5d6a7

# Yellow
color3 #e5c07b
color11 #f0d197

# Blue
color4 #64b5f6
color12 #90caf9

# Magenta
color5 #ba68c8
color13 #ce93d8

# Cyan
color6 #4dd0e1
